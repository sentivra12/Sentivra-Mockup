<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── FOUC Prevention ──────────────────────────────────────────── -->
    <script>
      (function() {
        var saved = localStorage.getItem('sentivra-theme') || 'system';
        var resolved = saved === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : saved;
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>

    <!-- ── Favicon (SP brand mark) ─────────────────────────────────── -->
    <link rel="icon"             type="image/svg+xml"  href="/favicon.svg" />
    <!-- Placeholder PNGs — generate from favicon.svg when official mark is ready -->
    <link rel="apple-touch-icon"              sizes="180x180" href="/favicon.svg" />

    <!-- ── Theme color — deep emerald ─────────────────────────────── -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#044D40" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#02231E" />

    <!-- ── Fonts: Plus Jakarta Sans (display) + IBM Plex Arabic ────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Caveat (mockup hero annotation) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- ── Preconnects ──────────────────────────────────────────────── -->
    <link rel="dns-prefetch"  href="https://images.unsplash.com" />
    <link rel="preconnect"    href="https://images.unsplash.com" crossorigin />

    <!-- ── SEO ──────────────────────────────────────────────────────── -->
    <meta name="description"
          content="Sentivra — Full-service software company building modern digital solutions. Web apps, mobile apps, ERP, CRM, AI chatbots for businesses in Egypt, UAE and Oman." />
    <meta name="keywords"
          content="web development, mobile apps, ERP, CRM, AI chatbots, software development, Egypt, UAE, Oman" />
    <meta name="author"  content="Sentivra" />
    <meta name="robots"  content="index, follow" />

    <!-- ── Open Graph ──────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://sentivra.com/" />
    <meta property="og:site_name"   content="Sentivra" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:title"       content="Sentivra — Building Modern Digital Solutions" />
    <meta property="og:description" content="Transform your business with custom web apps, mobile apps, ERP and AI solutions. Trusted partner across Egypt, UAE and Oman." />
    <meta property="og:image"       content="https://sentivra.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ── Twitter Card ─────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://sentivra.com/" />
    <meta name="twitter:title"       content="Sentivra — Building Modern Digital Solutions" />
    <meta name="twitter:description" content="Transform your business with custom web apps, mobile apps, ERP and AI solutions." />
    <meta name="twitter:image"       content="https://sentivra.com/og-image.png" />

    <!-- ── JSON-LD ──────────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Sentivra",
      "url": "https://sentivra.com",
      "logo": "https://sentivra.com/favicon.svg",
      "sameAs": [
        "https://www.linkedin.com/in/sentivra",
        "https://www.facebook.com/share/16vwkvzbwi/",
        "https://instagram.com/sentivra"
      ]
    }
    </script>

    <link rel="canonical" href="https://sentivra.com/" />

    <title>Sentivra — Building Modern Digital Solutions That Drive Results</title>
  </head>
  <body>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;padding:20px;text-align:center;">
        <div>
          <h1 style="color:#06796A;margin-bottom:16px;">JavaScript Required</h1>
          <p style="color:#6b7280;">Please enable JavaScript to run this application.</p>
        </div>
      </div>
    </noscript>

    <div id="root">
      <!-- Loading skeleton — matches brand colours, no layout shift -->
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#ffffff;">
        <div style="text-align:center;">
          <div style="width:60px;height:60px;border:4px solid #06796A;border-top-color:transparent;border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 16px;"></div>
          <p style="color:#06796A;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:17px;font-weight:600;">Loading Sentivra…</p>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .dark #root > div { background: #01120F; }
        .dark #root > div p { color: #26B59A; }
        .dark #root > div div { border-color: #26B59A; border-top-color: transparent; }
      </style>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Safety-net: replace stuck loader after 10 s -->
    <script>
      window.__APP_MOUNTED__ = false;
      setTimeout(function() {
        if (window.__APP_MOUNTED__) return;
        var root = document.getElementById('root');
        if (root && root.children.length === 1 && root.textContent.indexOf('Loading Sentivra') !== -1) {
          root.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;font-family:system-ui,sans-serif;text-align:center;">' +
            '<div style="max-width:480px;">' +
            '<h1 style="color:#1f2937;font-size:22px;font-weight:700;margin:0 0 10px;">App Failed to Load</h1>' +
            '<p style="color:#6b7280;margin:0 0 16px;">The backend may be paused or unreachable. Open the console (F12) for details.</p>' +
            '<button onclick="location.reload()" style="background:#06796A;color:white;border:none;padding:11px 22px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-right:8px;">Retry</button>' +
            '<button onclick="localStorage.clear();location.reload();" style="background:#ef4444;color:white;border:none;padding:11px 22px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;">Clear Cache &amp; Retry</button>' +
            '</div></div>';
        }
      }, 10000);
    </script>
  </body>
</html>
