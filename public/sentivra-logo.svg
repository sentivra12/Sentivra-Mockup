<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <circle cx="20" cy="20" r="20" fill="url(#gradient)" />
  
  <!-- Letter S with premium design -->
  <path d="M24.5 12.5C24.5 12.5 21.5 11 18.5 12.5C15.5 14 14.5 16.5 15.5 18.5C16.5 20.5 18.5 21 20.5 21.5C22.5 22 24.5 22.5 25.5 24.5C26.5 26.5 25.5 29 22.5 30C19.5 31 16.5 29.5 16.5 29.5" 
        stroke="white" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        class="logo-stroke" />
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5C7E8F" />
      <stop offset="100%" stop-color="#476574" />
    </linearGradient>
  </defs>
  
  <!-- Dark mode support -->
  <style>
    @media (prefers-color-scheme: dark) {
      circle {
        fill: url(#gradient-dark);
      }
    }
    .dark circle {
      fill: url(#gradient-dark);
    }
  </style>
  
  <defs>
    <linearGradient id="gradient-dark" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#476574" />
      <stop offset="100%" stop-color="#5C7E8F" />
    </linearGradient>
  </defs>
</svg>